<!DOCTYPE html><html lang=en><head><meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>AE territory map</title><style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:#fff;color:#16242e;font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
#box{height:100%;display:flex;flex-direction:column;padding:10px;gap:10px}
#mw{flex:1 1 auto;min-height:0;min-width:0;position:relative}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;background:#edf1f5;border-radius:12px}
.c{stroke:#fff;stroke-width:.4;cursor:pointer}.c:hover{stroke:#16242e;stroke-width:1.1}
svg.f .c{opacity:.15}svg.f .c.on{opacity:1;stroke-width:.5}
#lg{flex:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 10px;padding-top:10px;border-top:1px solid #dde3e9}
.sws{display:flex;gap:3px;flex:none}
.row{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:7px;cursor:pointer;border:1px solid transparent;user-select:none;font-size:15px}
.row:hover{background:#f4f6f9}.row[aria-pressed=true]{background:#eef2f7;border-color:#dde3e9}
.sw{width:14px;height:14px;border-radius:3.5px;flex:none}.row b{font-weight:600}.row i{color:#66757f;font-style:normal;font-size:13.5px}
#tip{position:fixed;pointer-events:none;z-index:30;background:#16242e;color:#fff;padding:8px 11px;border-radius:8px;font-size:14px;line-height:1.45;max-width:250px;opacity:0;transform:translate(-50%,calc(-100% - 14px));transition:opacity .07s;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#tip b{display:block;font-size:14.5px}#tip i{color:#9fb0bd;font-size:12.5px;font-style:normal}
/* Wide-and-short frame (an un-resized Notion embed): legend beside the map, not below it,
   so the map gets the height instead of losing it to the legend. */
@media(min-aspect-ratio:13/5){
#box{flex-direction:row;gap:8px;padding:8px}
#lg{width:238px;display:flex;flex-direction:column;justify-content:center;overflow:auto;padding:0;border-top:0}
.row{font-size:14.5px;padding:2px 6px;align-items:flex-start;gap:8px;flex:none}
.sws{margin-top:3px}
.row .lb{display:flex;flex-direction:column;line-height:1.25}
.row i{font-size:12.5px}
}
@media(max-width:640px){.row i{display:none}}
@media(prefers-color-scheme:dark){
html,body{background:#191919;color:#e6e6e4}
svg{background:#141f27}
.c{stroke:#191919;stroke-width:.35}.c:hover{stroke:#fff;stroke-width:1.1}
#lg{border-top-color:#333}
.row:hover{background:#262626}.row[aria-pressed=true]{background:#2c2c2c;border-color:#3d3d3d}
.row i{color:#9a9a97}
}
</style></head><body><div id=box>
<div id=mw><svg id=map viewBox="{{VIEWBOX}}" role=img aria-label="World map coloured by responsible Account Executive"><g transform="translate(8,8)"><!--PATHS--></g></svg></div>
<!--LEGEND--></div><div id=tip></div><script>
var N=/*NAMES*/,m=document.getElementById('map'),t=document.getElementById('tip'),
c=[].slice.call(document.querySelectorAll('.c')),R=[].slice.call(document.querySelectorAll('.row')),a=null;
function s(e){var x=e.currentTarget,g=x.getAttribute('data-g');
t.innerHTML='<b>'+x.getAttribute('data-n')+'</b>'+(g?'<i>'+x.getAttribute('data-r')+'</i><div>'+N[g]+'</div>':'<i>No AE assigned</i>');
t.style.left=e.clientX+'px';t.style.top=e.clientY+'px';t.style.opacity=1}
function h(){t.style.opacity=0}
c.forEach(function(p){p.addEventListener('mousemove',s);p.addEventListener('click',s);p.addEventListener('mouseleave',h)});
m.addEventListener('mouseleave',h);
function sel(k){a=(a===k)?null:k;R.forEach(function(r){r.setAttribute('aria-pressed',String(r.getAttribute('data-g')===a))});
if(!a){m.classList.remove('f');c.forEach(function(p){p.classList.remove('on')});return}
var gs=a.split(' ');m.classList.add('f');
c.forEach(function(p){p.classList[gs.indexOf(p.getAttribute('data-g'))>-1?'add':'remove']('on')})}
R.forEach(function(r){r.addEventListener('click',function(){sel(r.getAttribute('data-g'))});
r.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(r.getAttribute('data-g'))}})});
</script></body></html>
